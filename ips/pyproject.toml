[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-ips"
version = "0.1.0"
description = "A simulated intrusion prevention system for IoT devices: detector, risk engine, policy, incident database and reports."
readme = "README.md"
requires-python = ">=3.10"
# Exact pins: vulnerability scanners resolve a range such as ">=6.0" to its
# minimum version, so pins keep the audited version explicit. Keep in sync with
# requirements/*.txt (generated by scripts/lock-requirements.sh).
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "jsonschema==4.26.0"]
data = ["pandas==3.1.0", "numpy==2.5.4"]
# Fuzzing the detector with Atheris (see fuzz/fuzz_detector.py); needs clang.
fuzz = ["atheris==3.1.0"]

[project.scripts]
iot-ips = "iot_ips.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
