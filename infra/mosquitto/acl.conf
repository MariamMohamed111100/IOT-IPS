# Least privilege per service. Add new users here AND in scripts/setup.sh.

# Every service may publish only its own heartbeat
pattern write system/heartbeat/%u

user admin
topic readwrite #

user api
topic read #
topic write home/+/+/+/cmd

user simulators
topic write home/+/+/+/event
topic write home/+/+/+/status
topic read home/+/+/+/cmd
# scenario runner (run inside this container) -> simulators
topic readwrite system/sim/inject

user vision
topic write security/alerts/vision

user cyber
topic write security/alerts/cyber
topic read system/block

user engine
topic read home/#
topic read security/#
topic write home/+/+/+/cmd
topic write security/risk
topic write security/incidents
topic write security/alerts/engine
# block_ip action lands here; cyber reads it and reacts
topic write system/block
