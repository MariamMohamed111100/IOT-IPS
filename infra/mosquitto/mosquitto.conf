persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_timestamp true
log_type notice      # connection/auth events without info-level chatter

# TLS-only listener. No plain 1883 listener exists on purpose. The entrypoint
# copies passwd/acl/certs into /mosquitto/config as mosquitto-owned files.
listener 8883
cafile   /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/mosquitto.crt
keyfile  /mosquitto/config/certs/mosquitto.key
tls_version tlsv1.3

# Mutual TLS: clients must present a certificate signed by our CA, and the
# certificate CN becomes the username. With use_identity_as_username the
# password_file is not enforced; possession of a CA-signed cert is the auth.
require_certificate true
use_identity_as_username true

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Abuse limits: cap payload size (memory DoS) and client keepalive interval
# (stale-connection pile-up).
message_size_limit 131072
max_keepalive 3600
