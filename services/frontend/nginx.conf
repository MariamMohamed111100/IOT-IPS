events {}

http {
  # Dashboard + same-origin reverse proxy. The browser only ever talks to
  # http://localhost:8080; /api/* and /ws/* are relayed to the HTTPS API with
  # CA verification, so there is no CORS and WebSocket connections are WSS.
  # $api is resolved through the Compose DNS (127.0.0.11) so nginx survives
  # api container restarts instead of caching a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json;

    # The page is self-contained: no external font/CDN request, no frames, no plugins. 'unsafe-inline'
    # is required because the whole dashboard is one inline <script> and inline styles; it is not
    # what prevents XSS here (the renderers build DOM nodes and set textContent). What this policy
    # does add: no third-party script/style/font/img can be pulled in, no <base> rewriting, no
    # framing, no plugins, and injected markup cannot load a remote payload.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    client_max_body_size 256k;          # the API has its own cap; this is the edge limit

    set $api api;

    location / {
      try_files $uri $uri/ =404;
    }

    location /api/ {
      # proxy_pass uses a variable ($api) for restart-resilient DNS, and nginx
      # then passes the request URI through unchanged, so strip /api first.
      rewrite ^/api/(.*) /$1 break;
      proxy_pass https://$api:8443;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /certs/ca.crt;
      proxy_ssl_name api;
    }

    location /ws/ {
      access_log off;
      # proxy_pass with a variable and NO URI forwards the original request URI.
      # A URI part here ("/ws/") would replace it and the handshake would 403.
      proxy_pass https://$api:8443;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;    # silence must not drop the dashboard feed
      proxy_send_timeout 3600s;    # nginx defaults to 60s; uvicorn pings help, don't rely on them
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /certs/ca.crt;
      proxy_ssl_name api;
    }

    # Camera/face snapshots are personal data. They must never be published by a plain file
    # path: an <img> cannot carry the bearer token, so serving them here means serving them to
    # anyone who can reach this port (or guess a UUID). They belong behind the JWT-protected API.
    location /snapshots/ {
      deny all;
      return 403;
    }
  }
}