name: ips-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ips:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: ips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ips-dev-${{ matrix.python-version }}.txt
      - name: Install (hash-pinned lock, see scripts/lock-requirements.sh)
        run: |
          pip install --require-hashes -r ../requirements/ips-dev-${{ matrix.python-version }}.txt
          pip install --no-deps -e .
      - name: Unit tests
        run: python -m pytest
      - name: Demo (must use the real rule-based detector, never the placeholder)
        shell: bash
        run: |
          set -o pipefail
          python run_demo.py | tee demo.log
          grep -q "detector=rules" demo.log
          if grep -q "detector=placeholder" demo.log; then echo "the demo ran with the placeholder detector"; exit 1; fi
      - name: Demo database is intact and every incident has its action result
        run: |
          python - <<'PY'
          import sqlite3
          rows = sqlite3.connect("output/incidents.db").execute("SELECT action_result FROM incidents").fetchall()
          assert rows, "no incidents stored"
          assert not any(":planned:" in r[0] for r in rows), "an incident still has planned (not yet run) actions"
          PY
      - name: Evaluation (14 sample events against the expected results)
        run: python scripts/evaluate.py
      - name: Sample reports can be rebuilt
        run: python scripts/make_samples.py
      - name: Weight comparison
        run: python scripts/compare_weights.py
      - name: Calibration on normal traffic
        run: python scripts/calibrate.py --hours 6 --seeds 1,2
      - name: Dataset checks (needs Python 3.11+)
        if: matrix.python-version == '3.12'
        run: |
          pip install --require-hashes -r ../requirements/ips-data-py312.txt
          python scripts/data/check_data.py
      - name: Link scripts (adapter, seed, publisher, notifier)
        working-directory: .
        run: python scripts/ips/test_ips.py
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/frontend/test/package-lock.json
      - name: dashboard test (real API fixtures)
        working-directory: services/frontend/test
        # `npm ci` installs exactly the locked tree and verifies every hash.
        run: npm ci && npm test
  ips-cyber:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ips-cyber-py312.txt
      - name: Install (hash-pinned lock, see scripts/lock-requirements.sh)
        run: |
          pip install --require-hashes -r requirements/ips-cyber-py312.txt
          pip install --no-deps -e ips
      - name: Engine tests with the IPS chain (details, outbound rule, recorded ips_cyber alerts)
        run: |
          pip install --no-deps -e libs/common
          cd services/engine && python -m pytest -q
      - name: Cyber service tests (flow engine, envelopes, contract schema)
        working-directory: services/ips_cyber
        run: python -m pytest tests
