name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff pytest jsonschema pyyaml gpiozero httpx -r services/api/requirements.txt -r services/vision/requirements.txt -r services/engine/requirements.txt -r services/cyber/requirements.txt -e libs/common
      - run: ruff check .
      - run: pytest libs/common/tests services/simulators/tests -q
      - name: "API tests (separate run, service modules share top-level names)"
        run: pytest services/api/tests -q
      - name: "Vision tests (separate run, same reason)"
        run: pytest services/vision/tests -q
      - name: "Engine tests (separate run, same reason)"
        run: pytest services/engine/tests -q
      - name: "Cyber tests (separate run, same reason)"
        run: pytest services/cyber/tests -q
      - name: Validate contract and config files
        run: python scripts/validate_contract.py
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt -r services/simulators/requirements.txt \
            -r services/vision/requirements.txt -r services/engine/requirements.txt -r services/cyber/requirements.txt \
            -r services/engine/requirements.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Gitleaks (secret scan)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect -v --redact

  docker:
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Setup (secrets, certs, MQTT users)
        run: ./scripts/setup.sh
      - run: docker compose config -q
      - run: docker compose build
      - name: Integration smoke test
        run: |
          docker compose up -d
          sleep 15
          ./scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs --tail=100
