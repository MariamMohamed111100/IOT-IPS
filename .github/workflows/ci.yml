name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-py312.txt
      # Every install uses a hash-pinned lock file (pip --require-hashes), so the
      # build is reproducible and OpenSSF Scorecard's Pinned-Dependencies check
      # passes. Regenerate the locks with scripts/lock-requirements.sh.
      - name: Install (hash-pinned lock)
        run: |
          pip install --require-hashes -r requirements/ci-py312.txt
          pip install --no-deps -e libs/common -e ips
      - run: ruff check .
      - run: pytest libs/common/tests services/simulators/tests -q
      - name: "API tests (separate run, service modules share top-level names)"
        run: pytest services/api/tests -q
      # The two real-model tests need the (free, hash-pinned) model files; without
      # them they would skip, so they are fetched here and cached between runs.
      - name: Cache the vision models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/vision/models
          key: vision-models-${{ hashFiles('scripts/fetch_vision_models.py') }}
      - name: Vision models (for the real-model tests)
        run: python scripts/fetch_vision_models.py
      - name: "Vision tests (separate run, same reason)"
        run: pytest services/vision/tests -q
      - name: "Engine tests (separate run, same reason)"
        run: pytest services/engine/tests -q
      - name: "Cyber tests (separate run, same reason)"
        run: pytest services/cyber/tests -q
      - name: Validate contract and config files
        run: python scripts/validate_contract.py
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install --require-hashes -r requirements/audit-py312.txt
          pip-audit -r services/api/requirements.txt -r services/simulators/requirements.txt \
            -r services/vision/requirements.txt -r services/engine/requirements.txt -r services/cyber/requirements.txt

  # The real nftables backend can only be exercised as root, with `nft` and a private
  # network namespace. Keeping it in its own job means the normal runs never skip it.
  cyber-privileged:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-py312.txt
      - name: Install (hash-pinned lock)
        run: |
          pip install --require-hashes -r requirements/ci-py312.txt
          pip install --no-deps -e libs/common
      - name: nftables
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables
      - name: Real nftables backend in a private network namespace
        working-directory: services/cyber
        # `sudo` resets PATH, so point at the toolcache interpreter (which has pytest).
        run: sudo -E "$pythonLocation/bin/python" -m pytest tests -m privileged -q -ra

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Gitleaks (secret scan)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect -v --redact

  docker:
    runs-on: ubuntu-24.04
    needs: [lint-test, security]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup (secrets, certs, MQTT users)
        run: ./scripts/setup.sh
      - run: docker compose config -q
      - run: docker compose build
      - name: Start the stack and wait until every service is up
        run: docker compose up -d --wait --wait-timeout 600
      - name: Integration smoke test
        run: ./scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v --remove-orphans