[pytest]
# Two tests can only run where their inputs exist, so they opt in explicitly
# (`pytest -m dataset`, `pytest -m privileged`) instead of being skipped. A normal
# run is therefore fully green: everything collected either passes or is not selected.
markers =
    dataset: needs an external dataset that is not stored in the repository
    privileged: needs root, nftables and network namespaces

addopts = -m "not dataset and not privileged"