[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsecure-common"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.0", "pydantic>=2.5", "cryptography>=41"]

[tool.setuptools.packages.find]
include = ["smartsecure_common*"]
