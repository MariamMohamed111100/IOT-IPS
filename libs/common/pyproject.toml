[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsecure-common"
version = "0.1.0"
requires-python = ">=3.10"
# Exact pins: see the note in ips/pyproject.toml.
dependencies = ["paho-mqtt==2.1.0", "pydantic==2.14.1", "cryptography==50.0.2"]

[tool.setuptools.packages.find]
include = ["smartsecure_common*"]
